services:

  redis:
    build:
      context: ./cache
      dockerfile: Dockerfile
    container_name: artemis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - ./cache/data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artemis-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    expose:
      - "8080"
    depends_on:
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      SUPABASE_JWK_SET_URI: ${SUPABASE_JWK_SET_URI}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artemis-frontend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: artemis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
